<style>

    --ink: #E9F2EF;
    --ink-soft: #93B2AF;

  * { box-sizing: border-box; }
  /* The artifact host supplies this; a standalone page or the hosted app does not,

  body {

  }
  .wrap { max-width: 60rem; margin: 0 auto; padding: 28px 20px 0; }
  h1, h2, h3 { font-family: var(--display); font-weight: 800; text-wrap: balance; margin: 0; letter-spacing: -.02em; }

  /* ---- masthead ---- */

  .ticks button.done { background: var(--ink-soft); }
  .ticks button.current { background: var(--accent-fill); }

  .nextup { margin-top: 12px; font-family: var(--mono); font-size: .72rem; letter-spacing: .08em;
            text-transform: uppercase; color: var(--ink-soft); }

  /* ---- lists ---- */
  section { margin-top: 46px; }

  .lib-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lib-btn b { font-family: var(--display); font-weight: 600; display: block; }

  .hint { color: var(--ink-soft); font-size: .85rem; margin-top: 14px; }

                    border: 1px solid var(--rule); background: none; color: var(--ink-soft); }
  .install button.go { background: var(--accent-fill); color: var(--accent-ink); border-color: var(--accent-fill); }

  @media (max-width: 620px) {

    .tbtn.play { min-width: 76px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = {"episode": {"date": "2026-09-03", "title": "Startup Brief — Thursday, 3 September 2026", "seconds": 486, "segments": [{"id": "intro", "kind": "intro", "heading": "Today's brief", "subhead": "Thursday, 3 September 2026", "speak": "Good morning. This is your startup brief for Thursday, 3 September 2026. Today we have 8 companies: Abridge, Mirendil, SUN, Sazabi, Superset, Ezra, Kira, and Librar Labs. Each one takes about a minute. I will tell you what they do, what traction they have, why it matters, and one thing you could steal from them for your own idea. Let's go.", "seconds": 24, "meta": {"count": 8, "curated_on": "2026-09-03"}}, {"id": "abridge", "kind": "company", "heading": "Abridge", "subhead": "Andreessen Horowitz · a16z-led Series E · Healthcare AI", "speak": "Number 1 of 8. Abridge. Listens to the doctor's appointment and writes the medical note. Andreessen Horowitz, Andreessen Horowitz-led Series E. Abridge is ambient AI for clinicians. It sits in the room, listens to the conversation between doctor and patient, and produces the clinical documentation, so the doctor is not typing into a computer for hours after every shift. On traction: The category leader in ambient clinical documentation, deployed across large American health systems. On money: A three hundred million dollar Series E led by Andreessen Horowitz and Khosla Ventures in April 2026, valuing it at five point three billion dollars, with a reported extension of a further three hundred and sixteen million. Why it matters: Ambient documentation is the first AI product hospitals bought at scale, and it won because it gave time back rather than replacing anyone. And the thing to steal: Sell the hour back to the person who hates their paperwork. That buyer signs quickly and stays.", "seconds": 62, "meta": {"program": "a16z", "program_name": "Andreessen Horowitz", "batch": "a16z-led Series E", "sector": "Healthcare AI", "tags": ["healthcare", "ambient-ai", "enterprise"], "momentum": 5, "sources": ["https://www.mobihealthnews.com/news/abridge-secures-300m-boosts-valuation-53b", "https://www.fiercehealthcare.com/ai-and-machine-learning/ambient-ai-startup-abridge-scores-300m-series-e-backed-a16z-and-khosla"], "as_of": "2026-09-03", "one_liner": "Listens to the doctor's appointment and writes the medical note."}}, {"id": "mirendil", "kind": "company", "heading": "Mirendil", "subhead": "Breakout / benchmark company · Breakout · AI research lab", "speak": "Number 2 of 8. Mirendil. Autonomous systems that turn compute into scientific discoveries. Not in an accelerator batch. This one is on the list as a benchmark, because it is the company everyone else in its category is measured against. Mirendil is a research lab building self-accelerating systems for science - AI that runs the research loop itself across fields like biology and materials science, rather than assisting a human researcher. On traction: Founded in 2025 by Behnam Neyshabur, Harsh Mehta, Shayan Salehian and Tara Rezaei. On money: A two hundred million dollar seed round at a one billion dollar valuation, backed by Andreessen Horowitz, Nvidia, Kleiner Perkins and Neo. Why it matters: A two hundred million dollar seed at a billion-dollar valuation, on a research thesis with no product. That is the extreme end of this market. And the thing to steal: Reputation is now collateral. A team from the top of the research world can raise a Series B before writing a product.", "seconds": 64, "meta": {"program": "breakout", "program_name": "Breakout / benchmark company", "batch": "Breakout", "sector": "AI research lab", "tags": ["research", "science", "mega-seed"], "momentum": 5, "sources": ["https://www.finsmes.com/2026/06/mirendil-raises-200m-in-seed-funding-at-1-billion-valuation.html", "https://cryptobriefing.com/mirendil-200m-seed-round-a16z-nvidia/"], "as_of": "2026-09-03", "one_liner": "Autonomous systems that turn compute into scientific discoveries."}}, {"id": "sun-audio", "kind": "company", "heading": "SUN", "subhead": "a16z Speedrun · SR006 · Consumer AI, audio", "speak": "Number 3 of 8. SUN. Personalised podcasts and audiobooks you can interrupt and ask questions. Andreessen Horowitz Speedrun, SR006. SUN generates audio tailored to you - a podcast or audiobook built for your interests - and lets you talk back to it in real time, asking questions mid-listen and getting answers inside the same stream. On traction: A three-person team out of Harvard computer science, a Stanford AI PhD, and the founding engineer of Amazon Podcasts. Selected into the Andreessen Horowitz Speedrun sixth cohort. On money: Andreessen Horowitz Speedrun invests up to one million dollars, plus up to five million dollars in credits. Why it matters: This is precisely the format you are listening to right now, built as a company. Personalised, interruptible audio is a real emerging category. And the thing to steal: Worth watching closely if you ever want to build in this space - they are the closest competitor to your own daily brief.", "seconds": 61, "meta": {"program": "speedrun", "program_name": "a16z Speedrun", "batch": "SR006", "sector": "Consumer AI, audio", "tags": ["audio", "consumer", "personalisation"], "momentum": 4, "sources": ["https://genaiassembling.substack.com/p/speedruns-pivot-is-the-playbook-what"], "as_of": "2026-09-03", "one_liner": "Personalised podcasts and audiobooks you can interrupt and ask questions."}}, {"id": "sazabi", "kind": "company", "heading": "Sazabi", "subhead": "Y Combinator · W26 · Developer tools", "speak": "Number 4 of 8. Sazabi. Reads your production logs, works out why it broke, and ships the fix. Y Combinator, Winter 2026. When something breaks in production, Sazabi analyses the logs to find the cause, then generates the code fix and opens it for you in one click. It closes the loop between the alert and the patch. On traction: Called out as a Winter 2026 standout by multiple investors. On money: Y Combinator Winter 2026. Why it matters: Debugging production is where engineers actually lose their nights. This is the on-call engineer as a product. And the thing to steal: The winning agent products do not stop at the diagnosis. They deliver the fix.", "seconds": 45, "meta": {"program": "yc", "program_name": "Y Combinator", "batch": "W26", "sector": "Developer tools", "tags": ["devtools", "agents", "observability"], "momentum": 4, "sources": ["https://techcrunch.com/2026/03/26/16-of-the-most-interesting-startups-from-yc-w26-demo-day/"], "as_of": "2026-09-03", "one_liner": "Reads your production logs, works out why it broke, and ships the fix."}}, {"id": "superset", "kind": "company", "heading": "Superset", "subhead": "Y Combinator · Spring 2026 · Developer tools", "speak": "Number 5 of 8. Superset. Mission control for running a hundred coding agents at once. Y Combinator, Spring 2026. Superset centrally manages large fleets of coding agents, so a developer can run well over a hundred agent tasks in parallel and still know what each one is doing. On traction: Named among the standout companies of Spring 2026 by investors. On money: Y Combinator Spring 2026. Why it matters: One agent is a toy. A hundred agents is an operations problem, and operations problems are where durable software gets built. And the thing to steal: Whenever a unit becomes cheap and plentiful, the orchestration layer above it becomes valuable.", "seconds": 42, "meta": {"program": "yc", "program_name": "Y Combinator", "batch": "Spring 2026", "sector": "Developer tools", "tags": ["devtools", "agents", "orchestration"], "momentum": 4, "sources": ["https://techcrunch.com/2026/06/18/the-11-standout-startups-from-ycs-demo-day-according-to-vcs/"], "as_of": "2026-09-03", "one_liner": "Mission control for running a hundred coding agents at once."}}, {"id": "ezra", "kind": "company", "heading": "Ezra", "subhead": "a16z Speedrun · Speedrun alum · AI", "speak": "Number 6 of 8. Ezra. The biggest tracked round to come out of the Speedrun portfolio this year. Andreessen Horowitz Speedrun, Speedrun alum. Ezra is the Speedrun alumnus that raised the largest tracked round in the portfolio recently, showing what the follow-on path out of the programme looks like when it works. On traction: A thirty-two million dollar seed round in March 2026 - the largest tracked Speedrun deal. On money: Thirty-two million dollar seed, March 2026. Why it matters: Speedrun's whole thesis is being the first cheque before a much larger seed. Ezra is the proof point. And the thing to steal: Accelerators are increasingly graded on the size of the round that follows, not the demo day.", "seconds": 46, "meta": {"program": "speedrun", "program_name": "a16z Speedrun", "batch": "Speedrun alum", "sector": "AI", "tags": ["speedrun", "seed", "follow-on"], "momentum": 3, "sources": ["https://startupintros.com/orgs/a16z-speedrun"], "as_of": "2026-09-03", "one_liner": "The biggest tracked round to come out of the Speedrun portfolio this year."}}, {"id": "kira", "kind": "company", "heading": "Kira", "subhead": "a16z Speedrun · SR007 · Climate, water", "speak": "Number 7 of 8. Kira. Water technology, in a cohort otherwise full of software. Andreessen Horowitz Speedrun, SR007. Kira is the water technology company in the current Speedrun batch - one of the few in a cohort where the overwhelming majority carry an AI tag and more than half sell to businesses. On traction: Speedrun SR007, currently running. On money: Andreessen Horowitz Speedrun SR007. Why it matters: Data centres consume enormous quantities of water. Water and power are becoming the same conversation. And the thing to steal: Being the only one of your kind in a cohort is a position, not a problem. You are the memorable pitch in the room.", "seconds": 43, "meta": {"program": "speedrun", "program_name": "a16z Speedrun", "batch": "SR007", "sector": "Climate, water", "tags": ["climate", "water", "hardware", "current-cohort"], "momentum": 3, "sources": ["https://www.frontrun.vc/blog/a16z-speedrun-cohort-007-companies/"], "as_of": "2026-09-03", "one_liner": "Water technology, in a cohort otherwise full of software."}}, {"id": "librar-labs", "kind": "company", "heading": "Librar Labs", "subhead": "Y Combinator · W26 · Education software", "speak": "Number 8 of 8. Librar Labs. AI library management for schools. Y Combinator, Winter 2026. Librar Labs handles cataloguing and inventory for school libraries, replacing decades-old systems that librarians hate and administrators never budget to replace. On traction: Named among the most interesting Winter 2026 companies. On money: Y Combinator Winter 2026. Why it matters: A reminder that small, ignored institutional markets still get funded when the software is obviously ten times better. And the thing to steal: You do not need a large market to start. You need a market where the current software is genuinely terrible.", "seconds": 38, "meta": {"program": "yc", "program_name": "Y Combinator", "batch": "W26", "sector": "Education software", "tags": ["education", "vertical-saas"], "momentum": 2, "sources": ["https://techcrunch.com/2026/03/26/16-of-the-most-interesting-startups-from-yc-w26-demo-day/"], "as_of": "2026-09-03", "one_liner": "AI library management for schools."}}, {"id": "patterns", "kind": "patterns", "heading": "The pattern", "subhead": "What repeated today", "speak": "That's the companies. Now the pattern. Three things showed up more than once today: agents, devtools. When a theme repeats across companies that never met each other, that is usually the market telling you where the money is going. Sectors you just heard: AI, AI research lab, Climate, Consumer AI, Developer tools, Education software, Healthcare AI.", "seconds": 22, "meta": {"repeated_tags": ["agents", "devtools"], "sectors": ["AI", "AI research lab", "Climate", "Consumer AI", "Developer tools", "Education software", "Healthcare AI"]}}, {"id": "outro", "kind": "outro", "heading": "Your turn", "subhead": "Three questions to sit with", "speak": "That's the brief. Before you get out of the car, three questions. One. Take what Abridge is doing and ask who else has that exact problem but no budget for a specialist. That is usually the cheaper, faster version of the same company. Two. Of everything you just heard, which one could you build a rough version of this weekend? Not the whole thing. The single most annoying part of it. Three. Which of these companies would be trivial to beat in your own country or your own industry, because they will never bother to come here? Same time tomorrow. New companies.", "seconds": 39, "meta": {"prompt_count": 3, "date": "2026-09-03"}}]}, "library": [{"id": "pocket", "name": "Pocket", "program": "yc", "batch": "W26", "sector": "AI hardware, consumer", "one_liner": "A wearable note-taker that turns your conversations into action items.", "momentum": 5, "tags": ["hardware", "consumer", "productivity", "revenue-outlier"], "speak": "Pocket. A wearable note-taker that turns your conversations into action items. Backed by Y Combinator, Winter 2026. Pocket makes a small piece of hardware you clip on, paired with an app. It listens to your meetings and conversations and turns them into structured notes and action items, instead of a wall of transcript. Hardware plus software, sold direct to consumers. Traction: Reported around twenty-seven million dollars in annual recurring revenue, over thirty thousand units shipped in about five months, and roughly fifty percent month-over-month growth. It was the revenue outlier of its entire batch. Money: Y Combinator Winter 2026 batch. Numbers reported around Demo Day in March 2026. Why it matters: It is the loudest proof that AI hardware can go from zero to real revenue in months, not years, when the product does one obvious thing well. What to steal: Notice they did not build a general assistant. They picked one moment - the meeting you just walked out of - and owned it end to end.", "seconds": 65}, {"id": "asimov", "name": "Asimov", "program": "yc", "batch": "W26", "sector": "Robotics data", "one_liner": "Real-world movement video used to train humanoid robots.", "momentum": 5, "tags": ["robotics", "data", "picks-and-shovels"], "speak": "Asimov. Real-world movement video used to train humanoid robots. Backed by Y Combinator, Winter 2026. Asimov collects and supplies video of humans doing real physical work, and sells it to robotics companies who need diverse, messy, real-world motion data to train humanoids. They are a picks-and-shovels business for the robot boom. Traction: Named repeatedly by investors as one of the standouts of the Winter 2026 batch, in a batch where top valuations reached about two hundred million dollars post-money. Money: Y Combinator Winter 2026. Why it matters: Everyone is racing to build humanoids. Almost nobody has the training data. Asimov sells to all sides of that race. What to steal: The data bottleneck behind a hyped hardware wave is often a better business than the hardware.", "seconds": 49}, {"id": "hex-security", "name": "Hex Security", "program": "yc", "batch": "W26", "sector": "Cybersecurity", "one_liner": "Autonomous agents that continuously attack your own systems, so you find the holes first.", "momentum": 5, "tags": ["security", "agents", "b2b"], "speak": "Hex Security. Autonomous agents that continuously attack your own systems, so you find the holes first. Backed by Y Combinator, Winter 2026. Hex Security runs agentic offensive security. Instead of hiring a pen-test firm once a year, you point their agents at your systems and they probe your defenses continuously, the way a real attacker would, and report what they broke. Traction: One of only eight companies investors actively chased at the Winter 2026 Demo Day, according to TechCrunch. Money: Y Combinator Winter 2026. Why it matters: Penetration testing has been a consulting business for thirty years. Agents turn it into software with software margins. What to steal: Look for expensive services delivered once a year by humans. Those are the fattest targets for agents.", "seconds": 48}, {"id": "sazabi", "name": "Sazabi", "program": "yc", "batch": "W26", "sector": "Developer tools", "one_liner": "Reads your production logs, works out why it broke, and ships the fix.", "momentum": 4, "tags": ["devtools", "agents", "observability"], "speak": "Sazabi. Reads your production logs, works out why it broke, and ships the fix. Backed by Y Combinator, Winter 2026. When something breaks in production, Sazabi analyses the logs to find the cause, then generates the code fix and opens it for you in one click. It closes the loop between the alert and the patch. Traction: Called out as a Winter 2026 standout by multiple investors. Money: Y Combinator Winter 2026. Why it matters: Debugging production is where engineers actually lose their nights. This is the on-call engineer as a product. What to steal: The winning agent products do not stop at the diagnosis. They deliver the fix.", "seconds": 42}, {"id": "arc-prize", "name": "ARC Prize Foundation", "program": "yc", "batch": "W26", "sector": "AI benchmarks", "one_liner": "The benchmark competition that measures real progress toward general intelligence.", "momentum": 4, "tags": ["benchmarks", "research", "community"], "speak": "ARC Prize Foundation. The benchmark competition that measures real progress toward general intelligence. Backed by Y Combinator, Winter 2026. ARC Prize builds and runs benchmarks designed to test whether a model can genuinely reason on problems it has never seen, rather than recall training data. Frontier labs use their scores as a public scoreboard. Traction: Reported to have crossed one hundred thousand monthly visitors, and used by teams including OpenAI. Money: Y Combinator Winter 2026. Why it matters: Whoever defines the measuring stick quietly sets the agenda for the whole industry. What to steal: Owning the scoreboard in a hyped field buys you distribution and credibility that money cannot.", "seconds": 42}, {"id": "pax-historia", "name": "Pax Historia", "program": "yc", "batch": "W26", "sector": "Games, consumer AI", "one_liner": "Pick any country at any point in history and rewrite what happened.", "momentum": 4, "tags": ["games", "consumer", "simulation"], "speak": "Pax Historia. Pick any country at any point in history and rewrite what happened. Backed by Y Combinator, Winter 2026. Pax Historia is a browser-based grand strategy game where the world reacts to you through AI rather than scripted rules. Choose a nation, choose a year, make a decision history never made, and the simulation plays it forward. Traction: Around thirty-five thousand daily active users, and the highest-liked launch post of its entire batch, with over two thousand three hundred likes. Money: Y Combinator Winter 2026. Why it matters: One of the very few genuinely consumer AI hits in a batch that was overwhelmingly business software. What to steal: AI as the game engine, not the chatbot. The model generates the world, the player still plays a game.", "seconds": 50}, {"id": "gru-space", "name": "GRU Space", "program": "yc", "batch": "W26", "sector": "Space", "one_liner": "Permanent infrastructure on the Moon - including, eventually, a hotel.", "momentum": 3, "tags": ["space", "deep-tech", "moonshot"], "speak": "GRU Space. Permanent infrastructure on the Moon - including, eventually, a hotel. Backed by Y Combinator, Winter 2026. GRU Space is building the structures that stay on the lunar surface: habitats and permanent infrastructure rather than one-off landers. The headline version is a hotel on the Moon. Traction: One of the eight companies investors chased hardest at Winter 2026 Demo Day. Money: Y Combinator Winter 2026. Why it matters: A signal in itself. Investors are again funding twenty-year swings, not just software with revenue next quarter. What to steal: An outrageous long-term vision still raises money, but only if the first milestone is unglamorous and concrete.", "seconds": 41}, {"id": "grazemate", "name": "GrazeMate", "program": "yc", "batch": "W26", "sector": "Agriculture, robotics", "one_liner": "Autonomous drones that herd and monitor cattle.", "momentum": 3, "tags": ["agtech", "drones", "automation"], "speak": "GrazeMate. Autonomous drones that herd and monitor cattle. Backed by Y Combinator, Winter 2026. GrazeMate flies drones over grazing land to move cattle between paddocks and keep watch on the herd, replacing work that today needs people, dogs and quad bikes. Traction: Among the eight most chased companies at Winter 2026 Demo Day. Money: Y Combinator Winter 2026. Why it matters: Proof that the boring physical economy is where a lot of the remaining automation money sits. What to steal: Ranching is not a sexy market. It is also a market where nobody has built decent software and the buyer feels the pain daily.", "seconds": 40}, {"id": "luel", "name": "Luel", "program": "yc", "batch": "W26", "sector": "AI data", "one_liner": "A marketplace for human data to train multimodal models.", "momentum": 4, "tags": ["data", "marketplace", "ai-infra"], "speak": "Luel. A marketplace for human data to train multimodal models. Backed by Y Combinator, Winter 2026. Luel connects people willing to contribute video, audio and other human data with the labs that need it to train multimodal models. Think of it as a supply chain for the raw human signal models are running out of. Traction: One of the eight companies investors chased at Winter 2026 Demo Day. Money: Y Combinator Winter 2026. Why it matters: The public internet is exhausted as a training source. Fresh human data is now the scarce input. What to steal: Same pattern as Asimov and Mercor. Marketplaces for scarce training inputs are the quiet winners of this cycle.", "seconds": 44}, {"id": "stilta", "name": "Stilta", "program": "yc", "batch": "W26", "sector": "Legal tech", "one_liner": "Agentic AI built specifically for patent and intellectual property attorneys.", "momentum": 4, "tags": ["legal", "agents", "vertical-ai"], "speak": "Stilta. Agentic AI built specifically for patent and intellectual property attorneys. Backed by Y Combinator, Winter 2026. Stilta automates the document-heavy grind of IP and patent practice: drafting, prior art work, and office action responses, aimed at a profession that bills by the hour and drowns in paperwork. Traction: One of the eight most chased startups at Winter 2026 Demo Day. Legal tech was among the fastest-growing categories in the batch. Money: Y Combinator Winter 2026. Why it matters: Legal AI already produced Harvey and Legora as multi-billion-dollar companies. Patent law is the next unclaimed vertical. What to steal: Go one layer deeper than the obvious vertical. Not legal - patent legal.", "seconds": 43}, {"id": "byteport", "name": "Byteport", "program": "yc", "batch": "W26", "sector": "Infrastructure", "one_liner": "Absurdly fast file transfers.", "momentum": 3, "tags": ["infrastructure", "devtools", "performance"], "speak": "Byteport. Absurdly fast file transfers. Backed by Y Combinator, Winter 2026. Byteport moves very large files between machines and clouds far faster than the standard tools, aimed at teams shifting datasets, model weights and video around all day. Traction: Chased by investors at Winter 2026 Demo Day. Money: Y Combinator Winter 2026. Why it matters: AI workloads made data movement a bottleneck again, and the incumbent tools were designed for a smaller era. What to steal: Old, unglamorous infrastructure problems get new, large markets when the workload changes shape.", "seconds": 34}, {"id": "beyond-reach-labs", "name": "Beyond Reach Labs", "program": "yc", "batch": "W26", "sector": "Space", "one_liner": "Giant solar panels for satellites.", "momentum": 3, "tags": ["space", "energy", "deep-tech"], "speak": "Beyond Reach Labs. Giant solar panels for satellites. Backed by Y Combinator, Winter 2026. Beyond Reach Labs builds very large deployable solar arrays for spacecraft, so satellites and orbital compute can draw far more power than today's designs allow. Traction: One of the eight companies investors chased at Winter 2026 Demo Day. Money: Y Combinator Winter 2026. Why it matters: If anyone actually puts data centres in orbit, power generation is the first constraint they hit. What to steal: Bet on the input a whole speculative industry will need, rather than on the speculative industry itself.", "seconds": 37}, {"id": "condor-energy", "name": "Condor Energy", "program": "yc", "batch": "W26", "sector": "Energy software", "one_liner": "An operating system for how large companies buy and manage electricity.", "momentum": 4, "tags": ["energy", "b2b", "climate"], "speak": "Condor Energy. An operating system for how large companies buy and manage electricity. Backed by Y Combinator, Winter 2026. Condor gives enterprises one system to procure power and optimise how and when they generate and draw it, so electricity is cheaper, cleaner and more reliable. Traction: Named a Winter 2026 standout by multiple investors. Money: Y Combinator Winter 2026. Why it matters: Energy procurement went from a back-office line item to a board-level constraint the moment everyone started training models. What to steal: When a cost line explodes, the software that manages that line becomes a category overnight.", "seconds": 38}, {"id": "milliray", "name": "Milliray", "program": "yc", "batch": "W26", "sector": "Defense", "one_liner": "Radar that can actually see small drones.", "momentum": 3, "tags": ["defense", "hardware", "sensors"], "speak": "Milliray. Radar that can actually see small drones. Backed by Y Combinator, Winter 2026. Milliray builds radar systems tuned to detect and track small drones, the targets legacy air-defense radar was never designed to pick up. Traction: Featured among the most interesting Winter 2026 companies. Counter-drone was one of the hottest themes across both 2026 batches. Money: Y Combinator Winter 2026. Why it matters: Detection is the half of the counter-drone problem that has to be solved before any interceptor matters. What to steal: In every hyped category, ask which unsexy half of the problem everyone is skipping.", "seconds": 38}, {"id": "librar-labs", "name": "Librar Labs", "program": "yc", "batch": "W26", "sector": "Education software", "one_liner": "AI library management for schools.", "momentum": 2, "tags": ["education", "vertical-saas"], "speak": "Librar Labs. AI library management for schools. Backed by Y Combinator, Winter 2026. Librar Labs handles cataloguing and inventory for school libraries, replacing decades-old systems that librarians hate and administrators never budget to replace. Traction: Named among the most interesting Winter 2026 companies. Money: Y Combinator Winter 2026. Why it matters: A reminder that small, ignored institutional markets still get funded when the software is obviously ten times better. What to steal: You do not need a large market to start. You need a market where the current software is genuinely terrible.", "seconds": 36}, {"id": "nine-mothers", "name": "9 Mothers", "program": "yc", "batch": "Spring 2026", "sector": "Defense", "one_liner": "A cheap robot that tracks and kills drones flying at sixty miles an hour.", "momentum": 5, "tags": ["defense", "robotics", "counter-drone", "highest-valued"], "speak": "9 Mothers. A cheap robot that tracks and kills drones flying at sixty miles an hour. Backed by Y Combinator, Spring 2026. 9 Mothers builds counter-drone interceptors: a physically small, relatively affordable robot that detects a hostile drone, tracks it, and takes it down, rather than firing a missile that costs more than the target. Traction: Around one point six million dollars already booked in sales, with one contract expected to expand to thirty-five million dollars this year, and a claimed pipeline ambition of one billion dollars. Money: Investors chased it at a valuation upward of two hundred million dollars - the highest-valued company of the batch and one of the highest ever at a Y Combinator Demo Day. Why it matters: The cost asymmetry of drone warfare is the defining defense problem of the decade, and this is the batch's clearest bet on it. What to steal: The pitch was not better technology. It was a better unit cost against a threat that is already here.", "seconds": 65}, {"id": "apollo-atomics", "name": "Apollo Atomics", "program": "yc", "batch": "Spring 2026", "sector": "Energy, nuclear", "one_liner": "Small modular nuclear reactors to power AI data centres.", "momentum": 5, "tags": ["energy", "nuclear", "deep-tech", "ai-infra"], "speak": "Apollo Atomics. Small modular nuclear reactors to power AI data centres. Backed by Y Combinator, Spring 2026. Apollo Atomics prefabricates reactor components so a nuclear plant can be assembled rather than constructed over twenty years. They physically shipped a demonstrator on a truck from Texas to California and showed it to about a dozen investors. Traction: Twenty-four million dollar seed round, with Sam Altman among the backers. Founders include a nuclear science and engineering PhD from MIT and a former Tesla manufacturing engineer. Money: Twenty-four million dollar seed, Y Combinator Spring 2026. Why it matters: Power, not chips, is now the binding constraint on the AI build-out. Everyone knows it. Very few can actually build generation. What to steal: They shipped a physical demonstrator to the meeting. In hard tech, the demo is the deck.", "seconds": 52}, {"id": "ploy", "name": "Ploy", "program": "yc", "batch": "Spring 2026", "sector": "Marketing AI", "one_liner": "AI agents that run your growth marketing end to end.", "momentum": 5, "tags": ["marketing", "agents", "repeat-founder"], "speak": "Ploy. AI agents that run your growth marketing end to end. Backed by Y Combinator, Spring 2026. Ploy generates landing pages, writes the marketing copy, and launches and runs campaigns automatically. The explicit ambition is to make a large corporate marketing team unnecessary. Traction: Twenty-seven million dollar seed round led by First Round Capital and Y Combinator - unusually large for a company just out of the batch. Money: Twenty-seven million dollar seed. Founded by Bryant Chou, co-founder and former chief technology officer of Webflow. Why it matters: A repeat founder with a known outcome can raise a very large seed on the strength of the team alone in this market. What to steal: Second-time founders skip the proving stage. If you are a first-timer, your traction has to do that work instead.", "seconds": 51}, {"id": "jedify", "name": "Jedify", "program": "yc", "batch": "Spring 2026", "sector": "AI infrastructure", "one_liner": "A context graph so AI agents actually understand how your business works.", "momentum": 5, "tags": ["ai-infra", "enterprise", "agents", "context"], "speak": "Jedify. A context graph so AI agents actually understand how your business works. Backed by Y Combinator, Spring 2026. Jedify connects to a company's databases, warehouses, software tools, dashboards, documentation, code, Slack channels and meeting recordings, and builds a live graph of how the business actually operates, which agents then read from. Traction: Twenty-four million dollar Series A, with Snowflake joining as a strategic investor. Money: Twenty-four million dollar Series A, announced June 2026. Why it matters: Agents fail in the enterprise for one boring reason: they do not know the company. Context is becoming its own infrastructure layer. What to steal: The gap between a working demo and a working deployment is almost always context. That gap is a product.", "seconds": 47}, {"id": "silmaril", "name": "Silmaril", "program": "yc", "batch": "2026", "sector": "AI security", "one_liner": "A firewall for AI agents that defends against prompt injection and retrains itself.", "momentum": 5, "tags": ["security", "agents", "ai-safety"], "speak": "Silmaril. A firewall for AI agents that defends against prompt injection and retrains itself. Backed by Y Combinator, 2026. Silmaril stops attackers from hijacking an agent through the text it reads - a poisoned email, a booby-trapped document, a malicious web page. Their system detects new attack patterns and retrains its own defenses as attacks evolve. Traction: Repeatedly named a standout across the 2026 Y Combinator batches, in a year when AI security was one of the densest categories. Money: Y Combinator, 2026. Why it matters: The moment agents can take real actions - send money, send email, run code - prompt injection stops being a curiosity and becomes the top enterprise blocker. What to steal: Every platform shift creates a security category. This is that category for agents, and it is still early.", "seconds": 52}, {"id": "arga-labs", "name": "Arga Labs", "program": "yc", "batch": "Spring 2026", "sector": "Developer tools", "one_liner": "Digital-twin sandboxes where AI agents can test code before it touches production.", "momentum": 5, "tags": ["devtools", "testing", "agents"], "speak": "Arga Labs. Digital-twin sandboxes where AI agents can test code before it touches production. Backed by Y Combinator, Spring 2026. Arga Labs spins up realistic copies of an enterprise's environment so agent-written code can be exercised safely and repeatedly. Testing has fallen far behind AI code generation, and this is the safety net. Traction: Reported to have reached about forty thousand dollars in monthly recurring revenue within seven weeks, and raised a ten million dollar seed. Money: Ten million dollar seed, Y Combinator Spring 2026. Why it matters: AI writes far more code than any team can review. The bottleneck moved from writing to verifying. What to steal: When a new tool floods a pipeline, the next business is downstream of the flood.", "seconds": 48}, {"id": "clara", "name": "Clara", "program": "yc", "batch": "Spring 2026", "sector": "Healthcare AI", "one_liner": "Reads your charts, labs, wearables and clinical notes and surfaces what matters now.", "momentum": 4, "tags": ["healthcare", "ai", "data-integration"], "speak": "Clara. Reads your charts, labs, wearables and clinical notes and surfaces what matters now. Backed by Y Combinator, Spring 2026. Clara pulls together the fragments of a patient's record - chart history, lab results, wearable data, free-text clinical notes - and surfaces the important signals instantly instead of leaving them buried across systems. Traction: Had already raised twelve million dollars before even entering the batch. Money: Twelve million dollars raised pre-batch. Y Combinator Spring 2026. Why it matters: Healthcare's most expensive failure is not diagnosis, it is information that existed but nobody saw in time. What to steal: Some companies join an accelerator with money already in the bank. They are buying the network, not the cheque.", "seconds": 45}, {"id": "lightsprint", "name": "Lightsprint", "program": "yc", "batch": "Spring 2026", "sector": "Developer tools", "one_liner": "Product managers describe a change visually, cloud agents build it, an engineer approves it.", "momentum": 4, "tags": ["devtools", "agents", "collaboration"], "speak": "Lightsprint. Product managers describe a change visually, cloud agents build it, an engineer approves it. Backed by Y Combinator, Spring 2026. Lightsprint lets a whole team - including non-engineers - plan visually, preview the result live, and ship. You say what you want changed, pick from visual options, an agent builds it, and an engineer reviews and merges the code. Traction: Named among the buzziest companies of the Spring 2026 batch by multiple investors. Money: Y Combinator Spring 2026. Why it matters: It keeps the engineer in the loop as the approver rather than removing them, which is what actually gets adopted inside real companies. What to steal: The sellable version of 'AI replaces engineers' is 'AI drafts, your engineer approves'. Same output, far less resistance.", "seconds": 49}, {"id": "superset", "name": "Superset", "program": "yc", "batch": "Spring 2026", "sector": "Developer tools", "one_liner": "Mission control for running a hundred coding agents at once.", "momentum": 4, "tags": ["devtools", "agents", "orchestration"], "speak": "Superset. Mission control for running a hundred coding agents at once. Backed by Y Combinator, Spring 2026. Superset centrally manages large fleets of coding agents, so a developer can run well over a hundred agent tasks in parallel and still know what each one is doing. Traction: Named among the standout companies of Spring 2026 by investors. Money: Y Combinator Spring 2026. Why it matters: One agent is a toy. A hundred agents is an operations problem, and operations problems are where durable software gets built. What to steal: Whenever a unit becomes cheap and plentiful, the orchestration layer above it becomes valuable.", "seconds": 40}, {"id": "dispatch", "name": "Dispatch", "program": "yc", "batch": "Spring 2026", "sector": "Space", "one_liner": "A reusable vehicle that brings things manufactured in space back down to Earth.", "momentum": 4, "tags": ["space", "manufacturing", "logistics"], "speak": "Dispatch. A reusable vehicle that brings things manufactured in space back down to Earth. Backed by Y Combinator, Spring 2026. Dispatch is building the return leg of space manufacturing: a transport vehicle designed to be refurbished and flown repeatedly, carrying products made in orbit back to the ground. Traction: Named among the Spring 2026 standouts, in a batch heavy on defense and space. Money: Y Combinator Spring 2026. Why it matters: Several companies are trying to manufacture in orbit. Almost none have solved getting the product home affordably. What to steal: Find the step everyone in an emerging industry assumes someone else will solve.", "seconds": 40}, {"id": "adialante", "name": "Adialante", "program": "yc", "batch": "Spring 2026", "sector": "Medical devices", "one_liner": "An MRI machine small enough to fit in a truck, at two hundred and fifty dollars a scan.", "momentum": 4, "tags": ["healthcare", "hardware", "access"], "speak": "Adialante. An MRI machine small enough to fit in a truck, at two hundred and fifty dollars a scan. Backed by Y Combinator, Spring 2026. Adialante has designed a compact MRI unit that can be transported in a small truck and driven to where patients are, with a business model built on charging around two hundred and fifty dollars per scan. Traction: Named among the standouts of Spring 2026 by investors. Money: Y Combinator Spring 2026. Why it matters: Imaging is gated by million-dollar machines in fixed buildings. Shrink the machine and the entire access model changes. What to steal: Radical cost reduction is a strategy, not just an outcome. Price first, then design backwards to it.", "seconds": 45}, {"id": "anoria", "name": "Anoria", "program": "yc", "batch": "Spring 2026", "sector": "Consumer health", "one_liner": "A bracelet that reads over a hundred and fifty biometric signals for emotional health.", "momentum": 3, "tags": ["consumer", "hardware", "mental-health"], "speak": "Anoria. A bracelet that reads over a hundred and fifty biometric signals for emotional health. Backed by Y Combinator, Spring 2026. Anoria is a wearable that tracks more than a hundred and fifty biometric signals and interprets them for emotional and mental health, rather than for fitness. It is led by a hardware founder out of Apple. Traction: Named among the Spring 2026 standouts by investors. Money: Y Combinator Spring 2026. Why it matters: Wearables have measured the body for a decade. Almost nobody has made the mind the product. What to steal: Same sensors, different question. Reframing what existing hardware is for is a real wedge.", "seconds": 41}, {"id": "sun-audio", "name": "SUN", "program": "speedrun", "batch": "SR006", "sector": "Consumer AI, audio", "one_liner": "Personalised podcasts and audiobooks you can interrupt and ask questions.", "momentum": 4, "tags": ["audio", "consumer", "personalisation"], "speak": "SUN. Personalised podcasts and audiobooks you can interrupt and ask questions. Backed by Andreessen Horowitz Speedrun, SR006. SUN generates audio tailored to you - a podcast or audiobook built for your interests - and lets you talk back to it in real time, asking questions mid-listen and getting answers inside the same stream. Traction: A three-person team out of Harvard computer science, a Stanford AI PhD, and the founding engineer of Amazon Podcasts. Selected into the Andreessen Horowitz Speedrun sixth cohort. Money: Andreessen Horowitz Speedrun invests up to one million dollars, plus up to five million dollars in credits. Why it matters: This is precisely the format you are listening to right now, built as a company. Personalised, interruptible audio is a real emerging category. What to steal: Worth watching closely if you ever want to build in this space - they are the closest competitor to your own daily brief.", "seconds": 58}, {"id": "picpet", "name": "PicPet", "program": "speedrun", "batch": "SR006", "sector": "Consumer social", "one_liner": "A social network built around people's pets.", "momentum": 4, "tags": ["consumer", "social", "retention"], "speak": "PicPet. A social network built around people's pets. Backed by Andreessen Horowitz Speedrun, SR006. PicPet is a social platform where the pet is the account. It is one of the few genuinely consumer companies in a Speedrun cohort that has become overwhelmingly business software. Traction: Roughly two hundred and forty thousand daily active users, with about forty-five percent day-ninety retention - a genuinely strong retention number for consumer social. Money: Andreessen Horowitz Speedrun sixth cohort. Why it matters: Day-ninety retention near forty-five percent is the number that matters in consumer, and almost nobody hits it. What to steal: In consumer, one retention number is worth more than any amount of growth narrative.", "seconds": 43}, {"id": "kaaro", "name": "Kaaro", "program": "speedrun", "batch": "SR006", "sector": "Industrial AI", "one_liner": "An AI agent for the railway industry.", "momentum": 3, "tags": ["industrial", "agents", "vertical-ai"], "speak": "Kaaro. An AI agent for the railway industry. Backed by Andreessen Horowitz Speedrun, SR006. Kaaro builds agents for rail operations - one of those enormous, deeply regulated, paperwork-heavy industries that almost no software founder ever looks at. Traction: Selected into Andreessen Horowitz Speedrun's sixth cohort, where eighty-seven percent of the sixty companies carried an AI tag and more than half were business-to-business. Money: Andreessen Horowitz Speedrun SR006. Why it matters: Vertical agents in unglamorous heavy industry are one of the clearest patterns across every 2026 cohort. What to steal: Pick an industry you have unfair access to. Domain access beats model access now.", "seconds": 40}, {"id": "vereda", "name": "Vereda", "program": "speedrun", "batch": "SR006", "sector": "Agtech", "one_liner": "AI procurement for agriculture, built out of Brazil.", "momentum": 3, "tags": ["agtech", "procurement", "emerging-markets"], "speak": "Vereda. AI procurement for agriculture, built out of Brazil. Backed by Andreessen Horowitz Speedrun, SR006. Vereda handles buying for farms and agricultural businesses - inputs, equipment, supply - with AI running the sourcing and negotiation work that today happens over phone calls and WhatsApp. Traction: Selected into Andreessen Horowitz Speedrun SR006, one of the international companies in an increasingly global cohort. Money: Andreessen Horowitz Speedrun SR006. Why it matters: Top-tier American accelerators are now funding companies solving local problems in emerging markets, not just Silicon Valley software. What to steal: Your local market's broken process is a fundable company, and you understand it better than anyone in San Francisco.", "seconds": 42}, {"id": "bilrost", "name": "Bilrost", "program": "speedrun", "batch": "SR006", "sector": "Fintech", "one_liner": "Automates commercial loan processing.", "momentum": 3, "tags": ["fintech", "lending", "automation"], "speak": "Bilrost. Automates commercial loan processing. Backed by Andreessen Horowitz Speedrun, SR006. Bilrost takes the document-heavy grind of commercial lending - collecting statements, spreading financials, underwriting paperwork - and automates it for the banks and lenders who still do it by hand. Traction: Selected into Andreessen Horowitz Speedrun SR006. Roughly one third of that cohort published real revenue figures in their profiles. Money: Andreessen Horowitz Speedrun SR006. Why it matters: Commercial lending is enormous, slow, and still runs on PDFs and email. That combination is the classic agent opportunity. What to steal: Follow the PDF. Wherever an industry still emails documents around, there is a company.", "seconds": 41}, {"id": "ezra", "name": "Ezra", "program": "speedrun", "batch": "Speedrun alum", "sector": "AI", "one_liner": "The biggest tracked round to come out of the Speedrun portfolio this year.", "momentum": 3, "tags": ["speedrun", "seed", "follow-on"], "speak": "Ezra. The biggest tracked round to come out of the Speedrun portfolio this year. Backed by Andreessen Horowitz Speedrun, Speedrun alum. Ezra is the Speedrun alumnus that raised the largest tracked round in the portfolio recently, showing what the follow-on path out of the programme looks like when it works. Traction: A thirty-two million dollar seed round in March 2026 - the largest tracked Speedrun deal. Money: Thirty-two million dollar seed, March 2026. Why it matters: Speedrun's whole thesis is being the first cheque before a much larger seed. Ezra is the proof point. What to steal: Accelerators are increasingly graded on the size of the round that follows, not the demo day.", "seconds": 44}, {"id": "boardy", "name": "Boardy", "program": "hf0", "batch": "HF0", "sector": "Consumer AI, networking", "one_liner": "An AI that phones you, learns who you are, and introduces you to people worth meeting.", "momentum": 4, "tags": ["voice", "consumer", "networking"], "speak": "Boardy. An AI that phones you, learns who you are, and introduces you to people worth meeting. Backed by HF0 Residency, HF0. Boardy is a voice agent you actually talk to. It interviews you about what you are working on and who you need, then makes warm introductions across its network - a super-connector that scales. Traction: Named among HF0's most notable investments. HF0 writes one million dollar cheques for five percent, the largest single cheque among San Francisco accelerators. Money: HF0 Residency portfolio. Why it matters: Voice is the interface where AI feels least like software, and networking is a problem where a machine genuinely has more memory than you do. What to steal: The product is a phone call. No app, no onboarding, no dashboard. Distribution built into the interface.", "seconds": 51}, {"id": "roofer", "name": "Roofer.com", "program": "hf0", "batch": "HF0", "sector": "Vertical AI", "one_liner": "AI software for the roofing industry.", "momentum": 3, "tags": ["vertical-ai", "trades", "smb"], "speak": "Roofer.com. AI software for the roofing industry. Backed by HF0 Residency, HF0. Roofer.com brings AI-driven software to roofing contractors - quoting, lead handling, and the operational work of a trade business that has almost no modern software. Traction: Cited as one of HF0's notable portfolio companies. Money: HF0 Residency portfolio. Why it matters: The trades are enormous, profitable, fragmented, and almost entirely un-softwared. Repeat founders are now deliberately choosing them. What to steal: A great domain name plus a boring trade is a real strategy. Not everything has to be novel technology.", "seconds": 36}, {"id": "bastazo", "name": "Bastazo", "program": "hf0", "batch": "HF0", "sector": "Cybersecurity", "one_liner": "Vulnerability management, pitched to Sequoia and Accel out of the HF0 residency.", "momentum": 3, "tags": ["security", "enterprise", "prioritisation"], "speak": "Bastazo. Vulnerability management, pitched to Sequoia and Accel out of the HF0 residency. Backed by HF0 Residency, HF0. Bastazo works on vulnerability management - helping organisations work out which of the thousands of known security flaws in their systems actually matter and need fixing first. Traction: Went through the HF0 residency and presented at its Demo Day to investors including Sequoia Capital and Accel. Money: HF0 Residency portfolio. Why it matters: Security teams are drowning in alerts. Prioritisation, not detection, is the unsolved half. What to steal: HF0 takes repeat and highly technical founders in cohorts of about ten. Tiny cohort, huge cheque - a very different game from a big batch.", "seconds": 43}, {"id": "profound", "name": "Profound", "program": "spc", "batch": "SPC alum", "sector": "Marketing analytics", "one_liner": "Tells brands how they show up inside AI answers.", "momentum": 4, "tags": ["marketing", "analytics", "ai-search"], "speak": "Profound. Tells brands how they show up inside AI answers. Backed by South Park Commons, SPC alum. Profound measures and shapes how a brand is represented when people ask AI assistants questions - the search-engine-optimisation problem rebuilt for a world where the answer comes from a model, not a list of links. Traction: One of the companies most associated with the South Park Commons community, alongside Baseten, Render, Luma and Imbue. Money: South Park Commons network company. Why it matters: If people stop clicking links, every marketing budget on earth has to be re-pointed at whatever this category becomes. What to steal: When a distribution channel changes shape, the measurement layer for the new channel is a company.", "seconds": 46}, {"id": "mercor", "name": "Mercor", "program": "breakout", "batch": "Breakout", "sector": "AI data marketplace", "one_liner": "A marketplace that pays human experts to train frontier models.", "momentum": 5, "tags": ["marketplace", "ai-data", "hypergrowth"], "speak": "Mercor. A marketplace that pays human experts to train frontier models. On the list as a benchmark rather than an accelerator company. Mercor matches domain experts - doctors, lawyers, bankers, engineers - with the AI labs that need their judgement to train and evaluate models. It is a labour marketplace pointed at model training. Traction: Reported to have gone from about one million dollars to roughly two billion dollars in annualised gross revenue in around seventeen to twenty months, one of the fastest revenue ramps ever recorded. Money: Reported to be in talks to raise about five hundred million dollars at a twenty billion dollar valuation, up from ten billion in 2025. Why it matters: The scarce input in AI is no longer compute or data. It is expert human judgement, and Mercor built the exchange for it. What to steal: The fastest growth in this cycle came from a marketplace, not a model. Ask what the labs cannot buy anywhere else.", "seconds": 63}, {"id": "lovable", "name": "Lovable", "program": "breakout", "batch": "Breakout", "sector": "AI app building", "one_liner": "Describe an app in plain language and it builds and hosts it.", "momentum": 5, "tags": ["no-code", "hypergrowth", "europe"], "speak": "Lovable. Describe an app in plain language and it builds and hosts it. On the list as a benchmark rather than an accelerator company. Lovable turns a text description into a working web application - front end, back end, deployed - aimed at people who are not engineers. It is the flagship of what people call vibe coding. Traction: Went from zero to about five hundred million dollars in annualised revenue in roughly fourteen months. Money: Confirmed a thirteen point three billion dollar valuation in August 2026, raising another four hundred million dollars, up from about six point six billion in December. Why it matters: It is the clearest evidence that the buyer of software tools is shifting from engineers to everyone else. What to steal: The market was never engineers who want to code faster. It was the far larger group who could never code at all.", "seconds": 57}, {"id": "cursor", "name": "Cursor (Anysphere)", "program": "breakout", "batch": "Breakout", "sector": "Developer tools", "one_liner": "The AI code editor that became the fastest-growing business software company ever.", "momentum": 5, "tags": ["devtools", "hypergrowth", "benchmark"], "speak": "Cursor (Anysphere). The AI code editor that became the fastest-growing business software company ever. On the list as a benchmark rather than an accelerator company. Cursor is a code editor built around AI from the ground up, where the model reads your whole codebase and edits across it rather than autocompleting a line. Traction: Reported as the fastest business software company in history to one billion dollars in annual recurring revenue, and then to two billion - ahead of Slack, Zoom and Snowflake at the same stage. Money: Reported valuation around sixty billion dollars. Why it matters: It set the benchmark every developer-tools founder is now measured against, and it started as a small team competing with Microsoft. What to steal: They rebuilt an existing tool around the new capability instead of bolting the new capability onto the old tool.", "seconds": 54}, {"id": "baseten", "name": "Baseten", "program": "breakout", "batch": "YC alum, SPC-backed", "sector": "AI infrastructure", "one_liner": "The plumbing that serves AI models in production.", "momentum": 5, "tags": ["ai-infra", "inference", "yc-alum"], "speak": "Baseten. The plumbing that serves AI models in production. On the list as a benchmark rather than an accelerator company. Baseten handles deploying, serving and scaling machine learning models, so a company can run inference reliably without building its own infrastructure team. Traction: Reported total funding of around two point six billion dollars, backed by Greylock, Y Combinator and South Park Commons among others. Money: Valued at about thirteen billion dollars after a one point five billion dollar Series F led by Altimeter, Conviction and Spark Capital in June 2026. Why it matters: Inference is where the money in AI actually gets spent day to day, and Baseten sits directly in that flow. What to steal: A Y Combinator company from 2019 that took six years to become obvious. Timing is a real risk, and patience is a real strategy.", "seconds": 54}, {"id": "mirendil", "name": "Mirendil", "program": "breakout", "batch": "Breakout", "sector": "AI research lab", "one_liner": "Autonomous systems that turn compute into scientific discoveries.", "momentum": 5, "tags": ["research", "science", "mega-seed"], "speak": "Mirendil. Autonomous systems that turn compute into scientific discoveries. On the list as a benchmark rather than an accelerator company. Mirendil is a research lab building self-accelerating systems for science - AI that runs the research loop itself across fields like biology and materials science, rather than assisting a human researcher. Traction: Founded in 2025 by Behnam Neyshabur, Harsh Mehta, Shayan Salehian and Tara Rezaei. Money: A two hundred million dollar seed round at a one billion dollar valuation, backed by Andreessen Horowitz, Nvidia, Kleiner Perkins and Neo. Why it matters: A two hundred million dollar seed at a billion-dollar valuation, on a research thesis with no product. That is the extreme end of this market. What to steal: Reputation is now collateral. A team from the top of the research world can raise a Series B before writing a product.", "seconds": 55}, {"id": "sierra", "name": "Sierra", "program": "breakout", "batch": "Breakout", "sector": "Customer service AI", "one_liner": "AI agents that handle a company's customer conversations.", "momentum": 5, "tags": ["agents", "enterprise", "outcome-pricing"], "speak": "Sierra. AI agents that handle a company's customer conversations. On the list as a benchmark rather than an accelerator company. Sierra builds branded customer-service agents that actually resolve issues - refunds, changes, troubleshooting - rather than deflecting to a help article. It was founded by Bret Taylor, now also chairman of OpenAI. Traction: Reached one hundred million dollars in annual recurring revenue in seven quarters, and about two hundred million in twenty-six months. Money: Reported valuation of roughly fifteen point eight billion dollars. Why it matters: Customer service was the first big enterprise job that agents took outright, and Sierra is the template everyone copies. What to steal: They charge per resolved issue rather than per seat. Pricing on outcomes is spreading fast across AI products.", "seconds": 49}, {"id": "harvey", "name": "Harvey", "program": "breakout", "batch": "Breakout", "sector": "Legal AI", "one_liner": "AI built for elite law firms.", "momentum": 4, "tags": ["legal", "vertical-ai", "enterprise"], "speak": "Harvey. AI built for elite law firms. On the list as a benchmark rather than an accelerator company. Harvey does the research, drafting and document work inside large law firms and corporate legal departments, sold to the most conservative buyers in professional services. Traction: Reported valuation around eleven billion dollars. Its success, alongside Legora, is why legal tech became one of the densest categories in the 2026 accelerator batches. Money: Reported at roughly an eleven billion dollar valuation. Why it matters: Harvey proved that the most risk-averse industries will buy AI first if you sell it as leverage on billable work rather than as a replacement. What to steal: High hourly rates plus repetitive document work equals the best AI market in the world. Now find the version nobody has claimed.", "seconds": 51}, {"id": "etched", "name": "Etched", "program": "breakout", "batch": "Breakout", "sector": "AI chips", "one_liner": "A chip that does one thing - run transformers - and nothing else.", "momentum": 4, "tags": ["semiconductors", "ai-infra", "deep-tech"], "speak": "Etched. A chip that does one thing - run transformers - and nothing else. On the list as a benchmark rather than an accelerator company. Etched burns the transformer architecture directly into silicon. By giving up general-purpose flexibility, the bet is dramatically better speed and cost for the one model shape that matters commercially. Traction: Reported as one of the two largest Series B rounds of 2026 at around five hundred million dollars. Money: Reported five hundred million dollar Series B. Why it matters: It is a direct bet that the transformer stays dominant long enough to justify freezing it into hardware. What to steal: The boldest strategies are subtractive. They removed flexibility on purpose and made that the product.", "seconds": 46}, {"id": "upscale-ai", "name": "Upscale AI", "program": "breakout", "batch": "Breakout", "sector": "AI networking infrastructure", "one_liner": "Networking hardware built for AI data centres.", "momentum": 4, "tags": ["networking", "ai-infra", "hardware"], "speak": "Upscale AI. Networking hardware built for AI data centres. On the list as a benchmark rather than an accelerator company. Upscale AI builds the networking layer that connects thousands of accelerators inside an AI data centre, where moving data between chips is now as much of a bottleneck as the chips themselves. Traction: Raised a one hundred and ninety million dollar Series A extension, bringing total financing to about five hundred million dollars. Money: Reported valuation of around two billion dollars. Why it matters: Every dollar of the data centre build-out drags networking spend behind it, and that layer has far fewer credible players than compute. What to steal: Sell to the build-out, not to the hype. The suppliers get paid whether or not the applications work out.", "seconds": 50}, {"id": "replit", "name": "Replit", "program": "breakout", "batch": "Breakout", "sector": "Developer tools", "one_liner": "Build and deploy software from the browser, with an agent doing most of the typing.", "momentum": 4, "tags": ["devtools", "agents", "hypergrowth"], "speak": "Replit. Build and deploy software from the browser, with an agent doing most of the typing. On the list as a benchmark rather than an accelerator company. Replit is a browser-based environment where you describe what you want and an agent builds, runs and deploys it, with no local setup at all. Traction: Reported growth from about two and a half million dollars to roughly five hundred and twenty-five million dollars in annualised revenue in around fourteen months. Money: One of the fastest companies to one hundred million dollars in annual recurring revenue in 2026. Why it matters: A decade-old developer tool that found a completely new and much larger market by adding an agent to what it already had. What to steal: Distribution you already own plus a new capability can beat a new company with a better model.", "seconds": 54}, {"id": "unconventional-ai", "name": "Unconventional AI", "program": "a16z", "batch": "a16z co-led seed", "sector": "AI chips", "one_liner": "Chips designed like a brain, so AI stops burning a power station.", "momentum": 5, "tags": ["semiconductors", "deep-tech", "mega-seed", "energy"], "speak": "Unconventional AI. Chips designed like a brain, so AI stops burning a power station. Backed by Andreessen Horowitz, Andreessen Horowitz co-led seed. Unconventional is a research lab building a new computing architecture for AI. Their observation is that AI models are probabilistic but the chips running them are not, so they are designing hardware that matches the maths - chasing something closer to the twenty watts a human brain runs on. Traction: Chief executive Naveen Rao has sold two companies already: Nervana Systems to Intel for three hundred and fifty million dollars, and MosaicML to Databricks for one point three billion. Co-founders include Michael Carbin, Sara Achour and MeeLan Lee. Money: A four hundred and seventy-five million dollar seed round at a four point five billion dollar valuation, co-led by Andreessen Horowitz and Lightspeed, with Lux Capital, DCVC and Jeff Bezos also in. Reported as the first tranche of a round that could reach one billion. Why it matters: It is the largest seed round in this list by a distance, raised on a thesis and a founder's record, at a company only a couple of months old. What to steal: Two exits bought him a four point five billion dollar valuation before a product existed. Track record is the only thing that compounds like that.", "seconds": 84}, {"id": "ornn", "name": "Ornn", "program": "a16z", "batch": "a16z crypto seed", "sector": "Compute markets", "one_liner": "Turns GPU time into a commodity you can trade and hedge, like oil.", "momentum": 5, "tags": ["markets", "ai-infra", "fintech", "index"], "speak": "Ornn. Turns GPU time into a commodity you can trade and hedge, like oil. Backed by Andreessen Horowitz, Andreessen Horowitz crypto seed. Ornn is building a futures exchange for compute. Instead of privately negotiating a locked, long-term contract for a block of GPUs, you can price, trade, finance and hedge that capacity. Their price index covers live spot trades on H100, H200, B200 and RTX 5090 hardware. Traction: The Ornn Compute Price Index is already distributed on the Bloomberg Terminal, and in May 2026 the Intercontinental Exchange announced a partnership to launch US dollar cash-settled GPU compute futures based on it. Money: A thirty-three million dollar seed round led by Andreessen Horowitz's crypto arm, with Galaxy Ventures, Nordstar and SV Angel joining. Why it matters: Every commodity in history got a futures market once enough money depended on its price. Compute is now that big, and someone has to be the exchange. What to steal: They did not build a better GPU cloud. They built the price index for everyone else's, and got it onto Bloomberg.", "seconds": 68}, {"id": "abridge", "name": "Abridge", "program": "a16z", "batch": "a16z-led Series E", "sector": "Healthcare AI", "one_liner": "Listens to the doctor's appointment and writes the medical note.", "momentum": 5, "tags": ["healthcare", "ambient-ai", "enterprise"], "speak": "Abridge. Listens to the doctor's appointment and writes the medical note. Backed by Andreessen Horowitz, Andreessen Horowitz-led Series E. Abridge is ambient AI for clinicians. It sits in the room, listens to the conversation between doctor and patient, and produces the clinical documentation, so the doctor is not typing into a computer for hours after every shift. Traction: The category leader in ambient clinical documentation, deployed across large American health systems. Money: A three hundred million dollar Series E led by Andreessen Horowitz and Khosla Ventures in April 2026, valuing it at five point three billion dollars, with a reported extension of a further three hundred and sixteen million. Why it matters: Ambient documentation is the first AI product hospitals bought at scale, and it won because it gave time back rather than replacing anyone. What to steal: Sell the hour back to the person who hates their paperwork. That buyer signs quickly and stays.", "seconds": 60}, {"id": "glimpse", "name": "Glimpse", "program": "a16z", "batch": "YC alum, a16z Series A", "sector": "Fintech, retail", "one_liner": "Chases the money big retailers quietly deduct from consumer brands.", "momentum": 4, "tags": ["fintech", "retail", "automation", "pivot"], "speak": "Glimpse. Chases the money big retailers quietly deduct from consumer brands. Backed by Andreessen Horowitz, Y Combinator alum, Andreessen Horowitz Series A. When a supermarket chain pays a brand less than the invoice - a deduction for a damaged pallet, a late delivery, a promotion - somebody has to dispute it, line by line. Glimpse automates that deduction and dispute process for consumer packaged goods brands. Traction: A Y Combinator company that pivoted into this, then raised a large Series A on the back of it. Money: A thirty-five million dollar Series A led by Andreessen Horowitz, with 8VC and Y Combinator participating, announced March 2026. Why it matters: An unglamorous back-office leak with real money in it, in an industry where the incumbent process is a spreadsheet and a phone call. What to steal: This is a pivot story. The company that raised the Series A is not the company that got into the batch.", "seconds": 60}, {"id": "saronic", "name": "Saronic", "program": "a16z", "batch": "American Dynamism", "sector": "Defense", "one_liner": "Autonomous boats, built in America, at a price the navy can buy in numbers.", "momentum": 4, "tags": ["defense", "maritime", "american-dynamism", "manufacturing"], "speak": "Saronic. Autonomous boats, built in America, at a price the navy can buy in numbers. Backed by Andreessen Horowitz, American Dynamism. Saronic builds uncrewed surface vessels - autonomous boats for naval missions, designed to be produced in volume rather than as bespoke million-dollar craft. Traction: One of the flagship companies of Andreessen Horowitz's American Dynamism practice, alongside Anduril. Money: Reported to have raised a one hundred and seventy-five million dollar Series B at a one billion dollar valuation, led by Andreessen Horowitz. Why it matters: Andreessen Horowitz raised about one point two billion dollars for American Dynamism alone in January 2026. Defense manufacturing is now a core venture category, not a curiosity. What to steal: Same lesson as 9 Mothers, at a bigger scale: in defense, cheap and many beats exquisite and few.", "seconds": 51}, {"id": "anduril", "name": "Anduril", "program": "a16z", "batch": "American Dynamism", "sector": "Defense", "one_liner": "The company that proved a startup could sell serious weapons systems.", "momentum": 4, "tags": ["defense", "autonomy", "benchmark"], "speak": "Anduril. The company that proved a startup could sell serious weapons systems. Backed by Andr
