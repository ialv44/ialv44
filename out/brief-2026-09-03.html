(function () {
  "use strict";
  let EP = DATA.episode, LIB = DATA.library || [], PROGRAMS = DATA.programs || {};
  let SEGS = EP.segments || [];
  let CURATED = DATA.curated_on || "";
  const storageKey = () => "briefing:" + (EP.date || "preview");
  const synth = window.speechSynthesis;

  const el = (id) => document.getElementById(id);
  const state = {
    index: 0, sentences: [], sentenceAt: 0, playing: false,
    rate: 1, voice: null, adhoc: null, starred: []
  };

  /* ---------- persistence (private to this viewer, may be unavailable) ---------- */
  function load() {
    try {
      const raw = localStorage.getItem(storageKey());
      if (raw) {
        const saved = JSON.parse(raw);
        if (Number.isInteger(saved.index)) state.index = Math.min(saved.index, SEGS.length - 1);
        if (saved.rate) state.rate = saved.rate;
      }
      state.starred = JSON.parse(localStorage.getItem("briefing:starred") || "[]");
    } catch (e) { /* private mode, blocked storage — carry on */ }
  }
  function save() {
    try {
      localStorage.setItem(storageKey(), JSON.stringify({ index: state.index, rate: state.rate }));
      localStorage.setItem("briefing:starred", JSON.stringify(state.starred));
    } catch (e) { /* nothing to do */ }
  }

  /* ---------- helpers ---------- */
  const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");
  function splitSentences(text) {
    // Browsers truncate long utterances, so every segment is spoken sentence by sentence.
    return (text || "").split(/(?<=[.!?])\s+/).filter((s) => s.trim().length);
  }
  const current = () => state.adhoc || SEGS[state.index] || null;

  function pickVoice() {
    const voices = synth ? synth.getVoices() : [];
    if (!voices.length) return null;
    const wanted = [/en-GB.*(Google|Natural|Daniel|Serena)/i, /Google UK English/i,
                    /en-US.*(Google|Natural|Samantha|Aaron)/i, /^en[-_]/i];
    for (const re of wanted) {
      const hit = voices.find((v) => re.test(v.name) || re.test(v.lang));
      if (hit) return hit;
    }
    return voices[0];
  }

  /* ---------- rendering ---------- */
  function renderSegment() {
    const seg = current();
    if (!seg) return;
    el("segTitle").textContent = seg.heading;
    el("segSub").textContent = seg.subhead || "";
    el("stripTitle").textContent = seg.heading;
    el("stripSub").textContent = seg.subhead || EP.title;

    const chips = [];
    const meta = seg.meta || {};
    if (meta.program_name) chips.push({ t: meta.program_name, hot: seg.kind === "company" });
    if (meta.batch) chips.push({ t: meta.batch });
    if (meta.momentum) chips.push({ t: "momentum " + meta.momentum + "/5", hot: meta.momentum >= 5 });
    (meta.tags || []).slice(0, 4).forEach((t) => chips.push({ t: t.replace(/-/g, " ") }));
    el("segChips").innerHTML = chips
      .map((c) => '<span class="chip' + (c.hot ? " hot" : "") + '">' + esc(c.t) + "</span>").join("");

    state.sentences = splitSentences(seg.speak);
    state.sentenceAt = 0;
    paintBody();

    const starrable = seg.kind === "company";
    el("starBtn").hidden = !starrable;
    el("starBtn").setAttribute("aria-pressed", String(starrable && state.starred.includes(seg.id)));
    el("starBtn").textContent = (starrable && state.starred.includes(seg.id)) ? "★ Starred" : "☆ Star";

    const upcoming = state.adhoc ? SEGS[state.index] : SEGS[state.index + 1];
    el("nextUp").innerHTML = upcoming
      ? (state.adhoc ? "Back to the brief: " : "Next up: ") + "<b>" + esc(upcoming.heading) + "</b>"
      : "Last one. That's the brief.";

    document.querySelectorAll("#queue li").forEach((li, i) => {
      li.classList.toggle("playing", !state.adhoc && i === state.index);
    });
    document.querySelectorAll("#ticks button").forEach((b, i) => {
      b.className = i === state.index && !state.adhoc ? "current" : (i < state.index ? "done" : "");
    });
  }

  function paintBody() {
    el("segBody").innerHTML = state.sentences.map((s, i) => {
      const cls = i < state.sentenceAt ? "said" : (i === state.sentenceAt && state.playing ? "now" : "");
      return '<span class="' + cls + '">' + esc(s) + "</span> ";
    }).join("");
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function renderQueue() {
    el("queue").innerHTML = SEGS.map((s, i) => {
      const label = s.kind === "company" ? (s.meta.one_liner || s.subhead) : s.subhead;
      return '<li><button class="row" data-i="' + i + '">' +
        '<span class="num">' + String(i + 1).padStart(2, "0") + "</span>" +
        '<span><span class="name">' + esc(s.heading) + '</span><span class="desc">' + esc(label || "") + "</span></span>" +
        '<span class="dur">' + mmss(s.seconds) + "</span></button></li>";
    }).join("");
    if (!el("queue").dataset.wired) {
      el("queue").dataset.wired = "1";
      el("queue").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-i]");
        if (btn) go(Number(btn.dataset.i));
      });
    }

    el("ticks").innerHTML = SEGS.map((s, i) =>
      '<button data-i="' + i + '" title="' + esc(s.heading) + '" aria-label="' + esc(s.heading) + '"></button>').join("");
    if (!el("ticks").dataset.wired) {
      el("ticks").dataset.wired = "1";
      el("ticks").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-i]");
        if (btn) go(Number(btn.dataset.i));
      });
    }
  }

  function renderLibrary() {
    const groups = {};
    LIB.forEach((c) => { (groups[c.program] = groups[c.program] || []).push(c); });
    el("library").innerHTML = Object.keys(groups).map((key) => {
      const rows = groups[key].map((c) =>
        '<button class="lib-btn" data-cid="' + esc(c.id) + '"><b>' + esc(c.name) + "</b>" +
        "<span>" + esc(c.one_liner) + "</span></button>").join("");
      return '<div class="lib-group"><h3>' + esc(PROGRAMS[key] || key) +
             " · " + groups[key].length + '</h3><div class="lib-grid">' + rows + "</div></div>";
    }).join("");
    if (!el("library").dataset.wired) {
      el("library").dataset.wired = "1";
      el("library").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-cid]");
        if (btn) playCompany(btn.dataset.cid);
      });
    }
    el("libMeta").textContent = LIB.length + " companies · tap any one to hear it now";
  }

  function renderStarred() {
    const starred = state.starred
      .map((id) => LIB.find((c) => c.id === id))
      .filter(Boolean);
    el("starred").innerHTML = starred.map((c) =>
      '<button class="lib-btn" data-cid="' + esc(c.id) + '"><b>★ ' + esc(c.name) + "</b>" +
      "<span>" + esc(c.one_liner) + "</span></button>").join("");
  }
  el("starred").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-cid]");
    if (btn) playCompany(btn.dataset.cid);
  });

  /* ---------- speaking ---------- */
  let keepAlive = null;
  function speakCurrentSentence() {
    if (!synth || !state.playing) return;
    const line = state.sentences[state.sentenceAt];
    if (line === undefined) { advance(); return; }
    const utter = new SpeechSynthesisUtterance(line);
    utter.rate = state.rate;
    utter.pitch = 1;
    if (state.voice) { utter.voice = state.voice; utter.lang = state.voice.lang; }
    utter.onend = () => {
      if (!state.playing) return;
      state.sentenceAt += 1;
      if (state.sentenceAt >= state.sentences.length) advance();
      else { paintBody(); speakCurrentSentence(); }
    };
    utter.onerror = (e) => {
      if (e.error === "interrupted" || e.error === "canceled") return;
      stop();
      showWarn("This browser stopped the voice partway. Tap PLAY to pick it back up.");
    };
    synth.speak(utter);
    paintBody();
  }

  function advance() {
    if (state.adhoc) { state.adhoc = null; renderSegment(); stop(); return; }
    if (state.index >= SEGS.length - 1) { stop(); state.sentenceAt = state.sentences.length; paintBody(); return; }
    state.index += 1;
    save();
    renderSegment();
    speakCurrentSentence();
  }

  function play() {
    if (!synth) { showWarn("This browser has no built-in voice. The text below is the full brief — read it, or generate audio files from the repo."); return; }
    state.playing = true;
    el("playBtn").textContent = "PAUSE";
    if (!state.voice) state.voice = pickVoice();
    synth.cancel();
    speakCurrentSentence();
    // Chrome silently pauses long synthesis; nudging it keeps the brief running.
    clearInterval(keepAlive);
    keepAlive = setInterval(() => { if (state.playing && synth.paused) synth.resume(); }, 8000);
    updateMediaSession();
  }

  function stop() {
    state.playing = false;
    el("playBtn").textContent = "PLAY";
    clearInterval(keepAlive);
    if (synth) synth.cancel();
    paintBody();
    updateMediaSession();
  }

  function toggle() { state.playing ? stop() : play(); }

  function go(i) {
    state.adhoc = null;
    state.index = Math.max(0, Math.min(i, SEGS.length - 1));
    save();
    renderSegment();
    if (state.playing) { synth.cancel(); speakCurrentSentence(); } else { play(); }
  }

  function playCompany(cid) {
    const inToday = SEGS.findIndex((s) => s.id === cid);
    if (inToday >= 0) { go(inToday); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    const c = LIB.find((x) => x.id === cid);
    if (!c) return;
    state.adhoc = {
      id: c.id, kind: "company", heading: c.name,
      subhead: (PROGRAMS[c.program] || c.program) + " · " + c.batch + " · " + c.sector,
      speak: c.speak, seconds: c.seconds,
      meta: { program_name: PROGRAMS[c.program] || c.program, batch: c.batch, momentum: c.momentum, tags: c.tags }
    };
    renderSegment();
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (synth) synth.cancel();
    state.playing = false;
    play();
  }

  function showWarn(msg) {
    const box = el("ttsWarn");
    box.textContent = msg;
    box.hidden = false;
  }

  /* ---------- media keys (steering wheel / lock screen) ---------- */
  function updateMediaSession() {
    if (!("mediaSession" in navigator)) return;
    const seg = current();
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: seg ? seg.heading : EP.title,
        artist: EP.title,
        album: "Startup Brief Radio"
      });
      navigator.mediaSession.playbackState = state.playing ? "playing" : "paused";
      navigator.mediaSession.setActionHandler("play", play);
      navigator.mediaSession.setActionHandler("pause", stop);
      navigator.mediaSession.setActionHandler("nexttrack", () => go(state.index + 1));
      navigator.mediaSession.setActionHandler("previoustrack", () => go(state.index - 1));
    } catch (e) { /* not supported here */ }
  }

  /* ---------- wiring ---------- */
  el("playBtn").addEventListener("click", toggle);
  el("nextBtn").addEventListener("click", () => go(state.index + 1));
  el("prevBtn").addEventListener("click", () => go(state.index - 1));
  el("starBtn").addEventListener("click", () => {
    const seg = current();
    if (!seg || seg.kind !== "company") return;
    const at = state.starred.indexOf(seg.id);
    if (at >= 0) state.starred.splice(at, 1); else state.starred.push(seg.id);
    save(); renderSegment(); renderStarred();
  });

  el("rate").innerHTML = [0.9, 1, 1.15, 1.3].map((r) =>
    '<button data-r="' + r + '">' + r.toFixed(2).replace(/0$/, "").replace(/\.$/, "") + "×</button>").join("");
  el("rate").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-r]");
    if (!btn) return;
    state.rate = Number(btn.dataset.r);
    paintRate(); save();
    if (state.playing) { synth.cancel(); speakCurrentSentence(); }
  });
  function paintRate() {
    document.querySelectorAll("#rate button").forEach((b) =>
      b.setAttribute("aria-pressed", String(Number(b.dataset.r) === state.rate)));
  }

  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea")) return;
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    if (e.code === "ArrowRight") { e.preventDefault(); go(state.index + 1); }
    if (e.code === "ArrowLeft") { e.preventDefault(); go(state.index - 1); }
  });

  if (synth) {
    synth.onvoiceschanged = () => { if (!state.voice) state.voice = pickVoice(); };
    window.addEventListener("beforeunload", () => synth.cancel());
  }

  /* ---------- a fresh brief each morning ---------- */
  function paintHeader() {
    el("epTitle").textContent = EP.title;
    el("kicker").textContent = "Daily startup brief · " + (EP.date || "");
    el("epLen").textContent = mmss(EP.seconds || 0);
    el("epCount").textContent = SEGS.filter((s) => s.kind === "company").length;
    el("epPool").textContent = LIB.length;
    el("queueMeta").textContent = SEGS.length + " segments · " + mmss(EP.seconds || 0);
    el("foot").textContent = "Figures are as reported by the sources in the repository watchlist, "
      + "gathered " + (CURATED || EP.date) + ". Treat valuations and revenue as reported, not audited.";
    const today = new Date().toISOString().slice(0, 10);
    el("epStale").textContent = EP.date && EP.date < today
      ? "Showing the brief for " + EP.date : "";
  }

  function applyData(payload) {
    if (!payload || !payload.episode) return false;
    EP = payload.episode;
    SEGS = EP.segments || [];
    if (payload.library) LIB = payload.library;
    if (payload.programs) PROGRAMS = payload.programs;
    if (payload.curated_on) CURATED = payload.curated_on;
    state.adhoc = null;
    state.index = 0;
    load();
    paintHeader();
    renderQueue();
    renderLibrary();
    renderStarred();
    renderSegment();
    return true;
  }

  async function fetchJSON(path) {
    const response = await fetch(path, { cache: "no-cache" });
    if (!response.ok) throw new Error(response.status);
    return response.json();
  }

  async function hydrate() {
    // The installed app ships with the brief it was built from; this picks up
    // today's. Offline, the service worker hands back the last one it saw.
    try {
      const fresh = await fetchJSON("data/latest.json");
      if (fresh.episode && fresh.episode.date !== EP.date && !state.playing) applyData(fresh);
    } catch (e) { /* single-file copy, or no signal — the embedded brief stands */ }
  }

  async function loadArchive() {
    try {
      const index = await fetchJSON("data/index.json");
      const earlier = index.filter((e) => e.date !== EP.date)
        .sort((a, b) => b.date.localeCompare(a.date)).slice(0, 14);
      if (!earlier.length) return;
      el("archive").innerHTML = earlier.map((e) =>
        '<button class="lib-btn" data-date="' + esc(e.date) + '"><b>' + esc(e.date) + "</b>" +
        "<span>" + esc(e.companies.slice(0, 4).join(", ")) + "</span></button>").join("");
      el("archiveMeta").textContent = earlier.length + " to catch up on";
      el("archiveSec").hidden = false;
    } catch (e) { /* nothing published yet */ }
  }

  el("archive").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-date]");
    if (!btn) return;
    stop();
    try {
      applyData(await fetchJSON("data/" + btn.dataset.date + ".json"));
      loadArchive();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (err) { showWarn("That brief is not available offline."); }
  });

  /* ---------- home screen ---------- */
  function offerInstall() {
    const standalone = window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone;
    let dismissed = false;
    try { dismissed = localStorage.getItem("briefing:installed") === "no"; } catch (e) {}
    if (standalone || dismissed || location.protocol === "file:") return;

    const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    let prompt = null;
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      prompt = event;
      el("installMsg").textContent = "Add this to your home screen and it opens like an app, with a new brief every morning.";
      el("installBtn").hidden = false;
      el("installBar").hidden = false;
    });
    if (iOS) {
      el("installMsg").textContent = "Add this to your home screen: tap Share, then Add to Home Screen. It then opens like an app.";
      el("installBar").hidden = false;
    }
    el("installBtn").addEventListener("click", async () => {
      if (!prompt) return;
      prompt.prompt();
      await prompt.userChoice;
      prompt = null;
      el("installBar").hidden = true;
    });
    el("installX").addEventListener("click", () => {
      el("installBar").hidden = true;
      try { localStorage.setItem("briefing:installed", "no"); } catch (e) {}
    });
  }

  function registerWorker() {
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "http:" && location.protocol !== "https:") return;
    navigator.serviceWorker.register("sw.js").catch(() => { /* not hosted as an app */ });
  }

  /* ---------- boot ---------- */
  load();
  paintHeader();
  renderQueue();
  renderLibrary();
  renderStarred();
  renderSegment();
  paintRate();
  if (!synth) showWarn("This browser has no built-in voice, so nothing will speak. The full text of every segment is on the page.");
  hydrate();
  loadArchive();
  offerInstall();
  registerWorker();
})();
</script>
